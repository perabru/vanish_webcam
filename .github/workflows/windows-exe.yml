name: Windows executable

on:
  workflow_dispatch:
  push:
    branches: [windows-executable]
    paths:
      - '**.py'
      - '**.spec'
      - 'assets/**'
      - 'requirements*.txt'
      - 'BUILD_WINDOWS.bat'
      - '.github/workflows/windows-exe.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      PYGAME_HIDE_SUPPORT_PROMPT: '1'
      SDL_AUDIODRIVER: dummy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
          cache: pip
          cache-dependency-path: requirements-windows.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-windows.txt
          python -m pip check
      - name: Download models for offline use
        run: python -c "from vanish_cam import download_models; download_models()"
      - name: Run existing tests
        run: python scripts/run_tests.py
      - name: Verify source resources and native models
        run: python vanish_cam.py --self-test
      - name: Build standalone executable
        run: python -m PyInstaller --clean --noconfirm VanishCam.spec
      - name: Verify executable on Windows
        run: |
          & .\dist\VanishCam.exe --self-test
          if ($LASTEXITCODE -ne 0) { throw 'Executable self-test failed' }
          & .\dist\VanishCam.exe --help
          if ($LASTEXITCODE -ne 0) { throw 'Executable help failed' }
      - name: Package portable download
        shell: pwsh
        run: |
          Copy-Item LEIA-ME-WINDOWS.txt dist\LEIA-ME.txt
          Compress-Archive -Path dist\VanishCam.exe,dist\LEIA-ME.txt -DestinationPath dist\VanishCam-Windows-x64.zip
          Get-FileHash dist\VanishCam.exe,dist\VanishCam-Windows-x64.zip -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } | Set-Content dist\SHA256SUMS.txt
          python -m pip freeze | Set-Content dist\dependencies.txt
      - uses: actions/upload-artifact@v4
        with:
          name: VanishCam-Windows-x64
          path: |
            dist/VanishCam.exe
            dist/VanishCam-Windows-x64.zip
            dist/LEIA-ME.txt
            dist/SHA256SUMS.txt
            dist/dependencies.txt
          if-no-files-found: error
          retention-days: 90
      - name: Publish executable download
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = "windows-20261104-$env:GITHUB_RUN_NUMBER"
          gh release create $tag dist/VanishCam.exe dist/VanishCam-Windows-x64.zip dist/SHA256SUMS.txt dist/dependencies.txt --target "$env:GITHUB_SHA" --title "VanishCam para Windows 64 bits" --notes-file LEIA-ME-WINDOWS.txt
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
